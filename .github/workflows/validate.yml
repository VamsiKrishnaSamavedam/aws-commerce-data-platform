name: Validate commerce platform

on:
  pull_request:
  push:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install boto3 cfn-lint
      - name: Compile Python modules
        run: python -m compileall -q scripts src tests
      - name: Run contract tests
        run: python -m unittest discover -s tests -v
      - name: Verify CloudFormation syntax
        run: cfn-lint infrastructure/phase6-orchestration.yaml
      - name: Build deployable packages
        run: |
          python scripts/package_glue_ledger.py
          python scripts/package_phase6_orchestrator.py

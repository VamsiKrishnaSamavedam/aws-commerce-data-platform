AWSTemplateFormatVersion: '2010-09-09'
Description: Safe sequenced manifest orchestration for Commerce incremental datasets.

Parameters:
  ArtifactBucket: {Type: String}
  ArtifactKey: {Type: String}
  GlueScriptKey: {Type: String, Default: glue-scripts/phase7/glue_incremental_commerce_dataset.py}
  GlueLibraryKey: {Type: String, Default: glue-scripts/dependencies/commerce_ledger_lib_phase7.zip}
  DataBucket: {Type: String, Default: aws-commerce-data-platform-036071343416-us-east-1}
  LedgerTableName: {Type: String, Default: commerce-batch-ledger}
  GlueJobName: {Type: String, Default: commerce-customers-iceberg-merge-ledger}
  AlertTopicArn: {Type: String, Default: arn:aws:sns:us-east-1:036071343416:commerce-pipeline-alerts}

Resources:
  OrchestrationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: /aws/vendedlogs/states/commerce-incremental-customers, RetentionInDays: 30}
  EventFailureQueue:
    Type: AWS::SQS::Queue
    Properties: {QueueName: commerce-incremental-customer-events-dlq, MessageRetentionPeriod: 1209600, SqsManagedSseEnabled: true}
  EventFailureQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref EventFailureQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: events.amazonaws.com}
            Action: sqs:SendMessage
            Resource: !GetAtt EventFailureQueue.Arn
            Condition: {ArnEquals: {aws:SourceArn: !GetAtt ManifestCreatedRule.Arn}}
  OrchestratorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: commerce-incremental-batch-registrar
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      Policies:
        - PolicyName: registrar-least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents], Resource: '*'}
              - Effect: Allow
                Action: [s3:GetObject, s3:HeadObject]
                Resource: !Sub arn:${AWS::Partition}:s3:::${DataBucket}/bronze/*/incremental/*
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Scan, dynamodb:TransactWriteItems]
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${LedgerTableName}
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:commerce-incremental-customer-orchestrator
  OrchestratorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: commerce-incremental-batch-registrar
      Runtime: python3.12
      Handler: scripts.register_incremental_batches.lambda_handler
      Role: !GetAtt OrchestratorRole.Arn
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:commerce-incremental-customer-orchestrator
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Ref ArtifactKey}
  StateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: commerce-incremental-customer-orchestrator
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: states.amazonaws.com}, Action: sts:AssumeRole}]}
      Policies:
        - PolicyName: orchestrator-invocation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: lambda:InvokeFunction, Resource: !GetAtt OrchestratorFunction.Arn}
              - Effect: Allow
                Action: [glue:StartJobRun, glue:GetJobRun, glue:BatchStopJobRun]
                Resource:
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:job/${GlueJobName}
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:job/commerce-products-incremental-iceberg
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:job/commerce-orders-incremental-iceberg
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:job/commerce-order-items-incremental-iceberg
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:job/commerce-payments-incremental-iceberg
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:job/commerce-shipments-incremental-iceberg
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:job/commerce-returns-incremental-iceberg
              - {Effect: Allow, Action: [logs:CreateLogDelivery, logs:GetLogDelivery, logs:UpdateLogDelivery, logs:DeleteLogDelivery, logs:ListLogDeliveries, logs:PutResourcePolicy, logs:DescribeResourcePolicies, logs:DescribeLogGroups], Resource: '*'}
  CustomerOrchestrator:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: commerce-incremental-customer-orchestrator
      StateMachineType: STANDARD
      RoleArn: !GetAtt StateMachineRole.Arn
      LoggingConfiguration: {Destinations: [{CloudWatchLogsLogGroup: {LogGroupArn: !GetAtt OrchestrationLogGroup.Arn}}], IncludeExecutionData: false, Level: ALL}
      DefinitionString: !Sub |
        {"StartAt":"Register","States":{"Register":{"Type":"Task","Resource":"arn:aws:states:::lambda:invoke","Parameters":{"FunctionName":"${OrchestratorFunction.Arn}","Payload.$":"$"},"ResultSelector":{"action.$":"$.Payload.action","dataset.$":"$.Payload.dataset","batch_id.$":"$.Payload.batch_id","source_s3_uri.$":"$.Payload.source_s3_uri","glue_job_name.$":"$.Payload.glue_job_name"},"ResultPath":"$.registration","Next":"ShouldRunGlue"},"ShouldRunGlue":{"Type":"Choice","Choices":[{"Variable":"$.registration.action","StringEquals":"START_GLUE","Next":"ChooseGlueJob"}],"Default":"NoWork"},"ChooseGlueJob":{"Type":"Choice","Choices":[{"Variable":"$.registration.dataset","StringEquals":"customers","Next":"RunCustomerGlue"}],"Default":"RunDatasetGlue"},"RunCustomerGlue":{"Type":"Task","Resource":"arn:aws:states:::glue:startJobRun.sync","Parameters":{"JobName":"${GlueJobName}","Arguments":{"--INCREMENTAL_SOURCE.$":"$.registration.source_s3_uri","--SIMULATE_POST_MERGE_FAILURE":"false"}},"ResultPath":"$.glue","Catch":[{"ErrorEquals":["States.ALL"],"Next":"GlueFailed"}],"Next":"VerifyCompletion"},"RunDatasetGlue":{"Type":"Task","Resource":"arn:aws:states:::glue:startJobRun.sync","Parameters":{"JobName.$":"$.registration.glue_job_name","Arguments":{"--DATASET.$":"$.registration.dataset","--MODE":"MERGE","--BUCKET":"${DataBucket}","--SOURCE_PATH.$":"$.registration.source_s3_uri"}},"ResultPath":"$.glue","Catch":[{"ErrorEquals":["States.ALL"],"Next":"GlueFailed"}],"Next":"VerifyCompletion"},"VerifyCompletion":{"Type":"Task","Resource":"arn:aws:states:::lambda:invoke","Parameters":{"FunctionName":"${OrchestratorFunction.Arn}","Payload":{"operation":"verify_completion","dataset.$":"$.registration.dataset","batch_id.$":"$.registration.batch_id"}},"ResultSelector":{"action.$":"$.Payload.action","dataset.$":"$.Payload.dataset","stream_id.$":"$.Payload.stream_id"},"ResultPath":"$.verification","Next":"WasCompleted"},"WasCompleted":{"Type":"Choice","Choices":[{"Variable":"$.verification.action","StringEquals":"COMPLETED","Next":"DispatchNext"}],"Default":"VerificationFailed"},"DispatchNext":{"Type":"Task","Resource":"arn:aws:states:::lambda:invoke","Parameters":{"FunctionName":"${OrchestratorFunction.Arn}","Payload":{"operation":"dispatch_next","dataset.$":"$.verification.dataset","stream_id.$":"$.verification.stream_id"}},"Next":"Succeeded"},"NoWork":{"Type":"Succeed"},"Succeeded":{"Type":"Succeed"},"GlueFailed":{"Type":"Fail","Error":"GlueJobFailed"},"VerificationFailed":{"Type":"Fail","Error":"LedgerCompletionNotVerified"}}}
  ManifestCreatedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: commerce-customer-manifest-created
      EventPattern: {source: [aws.s3], detail-type: [Object Created], detail: {bucket: {name: [!Ref DataBucket]}, object: {key: [{wildcard: bronze/*/incremental/*/manifest.json}]}}}
      State: ENABLED
      Targets: [{Arn: !Ref CustomerOrchestrator, Id: customer-manifest-orchestrator, RoleArn: !GetAtt EventBridgeStartExecutionRole.Arn, RetryPolicy: {MaximumEventAgeInSeconds: 3600, MaximumRetryAttempts: 12}, DeadLetterConfig: {Arn: !GetAtt EventFailureQueue.Arn}}]
  EventBridgeStartExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: events.amazonaws.com}, Action: sts:AssumeRole}]}
      Policies: [{PolicyName: start-customer-orchestrator, PolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Action: states:StartExecution, Resource: !Ref CustomerOrchestrator}]}}]
  OrchestratorFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties: {AlarmName: commerce-incremental-customer-orchestrator-failures, Namespace: AWS/States, MetricName: ExecutionsFailed, Dimensions: [{Name: StateMachineArn, Value: !Ref CustomerOrchestrator}], Statistic: Sum, Period: 300, EvaluationPeriods: 1, Threshold: 1, ComparisonOperator: GreaterThanOrEqualToThreshold, TreatMissingData: notBreaching, AlarmActions: [!Ref AlertTopicArn]}
  RegistrarErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties: {AlarmName: commerce-incremental-batch-registrar-errors, Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{Name: FunctionName, Value: !Ref OrchestratorFunction}], Statistic: Sum, Period: 300, EvaluationPeriods: 1, Threshold: 1, ComparisonOperator: GreaterThanOrEqualToThreshold, TreatMissingData: notBreaching, AlarmActions: [!Ref AlertTopicArn]}
  EventDlqMessagesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties: {AlarmName: commerce-incremental-customer-events-dlq-messages, Namespace: AWS/SQS, MetricName: ApproximateNumberOfMessagesVisible, Dimensions: [{Name: QueueName, Value: !GetAtt EventFailureQueue.QueueName}], Statistic: Maximum, Period: 300, EvaluationPeriods: 1, Threshold: 1, ComparisonOperator: GreaterThanOrEqualToThreshold, TreatMissingData: notBreaching, AlarmActions: [!Ref AlertTopicArn]}
  OperationalAuditRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: commerce-operational-ledger-audit
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      Policies:
        - PolicyName: audit-ledger-and-metrics
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents], Resource: '*'}
              - Effect: Allow
                Action: dynamodb:Scan
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${LedgerTableName}
              - {Effect: Allow, Action: cloudwatch:PutMetricData, Resource: '*', Condition: {StringEquals: {cloudwatch:namespace: CommerceDataPlatform/Operations}}}
  OperationalAuditFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: commerce-operational-ledger-audit
      Runtime: python3.12
      Handler: scripts.operational_ledger_audit.lambda_handler
      Role: !GetAtt OperationalAuditRole.Arn
      Timeout: 60
      MemorySize: 256
      Environment: {Variables: {LEDGER_TABLE: !Ref LedgerTableName}}
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Ref ArtifactKey}
  OperationalAuditSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: commerce-operational-ledger-audit-hourly
      ScheduleExpression: rate(1 hour)
      State: ENABLED
      Targets: [{Arn: !GetAtt OperationalAuditFunction.Arn, Id: operational-ledger-audit}]
  OperationalAuditPermission:
    Type: AWS::Lambda::Permission
    Properties: {Action: lambda:InvokeFunction, FunctionName: !Ref OperationalAuditFunction, Principal: events.amazonaws.com, SourceArn: !GetAtt OperationalAuditSchedule.Arn}
  StuckProcessingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties: {AlarmName: commerce-operational-stuck-processing, Namespace: CommerceDataPlatform/Operations, MetricName: StuckProcessing, Statistic: Maximum, Period: 3600, EvaluationPeriods: 1, Threshold: 1, ComparisonOperator: GreaterThanOrEqualToThreshold, TreatMissingData: notBreaching, AlarmActions: [!Ref AlertTopicArn]}
  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: commerce-data-platform-operations
      DashboardBody: !Sub |
        {"widgets":[{"type":"metric","properties":{"title":"Workflow failures","view":"timeSeries","region":"${AWS::Region}","metrics":[["AWS/States","ExecutionsFailed","StateMachineArn","${CustomerOrchestrator}"]] }},{"type":"metric","properties":{"title":"Registrar errors and DLQ","view":"timeSeries","region":"${AWS::Region}","metrics":[["AWS/Lambda","Errors","FunctionName","${OrchestratorFunction}"],["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${EventFailureQueue.QueueName}"]] }},{"type":"metric","properties":{"title":"Ledger audit","view":"timeSeries","region":"${AWS::Region}","metrics":[["CommerceDataPlatform/Operations","StuckProcessing"],[".","WatermarkGaps"]]}},{"type":"metric","properties":{"title":"dbt build failures","view":"timeSeries","region":"${AWS::Region}","metrics":[["AWS/CodeBuild","FailedBuilds","ProjectName","${DbtBuildProject}"]]}}]}
  DbtBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: commerce-dbt-athena-build
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: codebuild.amazonaws.com}, Action: sts:AssumeRole}]}
      Policies:
        - PolicyName: dbt-athena-least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents], Resource: '*'}
              - {Effect: Allow, Action: [athena:StartQueryExecution, athena:GetQueryExecution, athena:GetQueryResults, athena:StopQueryExecution, athena:GetWorkGroup], Resource: '*'}
              - Effect: Allow
                Action: [glue:GetDatabase, glue:GetDatabases, glue:GetTable, glue:GetTables, glue:CreateTable, glue:UpdateTable, glue:DeleteTable]
                Resource:
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/commerce_incremental
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/commerce_analytics
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/commerce_incremental/*
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/commerce_analytics/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${DataBucket}'
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${DataBucket}/*'
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${DataBucket}/athena-results/dbt/*
                  - !Sub arn:${AWS::Partition}:s3:::${DataBucket}/gold_dbt/*
  DbtBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: commerce-dbt-athena-build
      Description: Rebuilds verified dbt analytics models after incremental commerce completion.
      ServiceRole: !GetAtt DbtBuildRole.Arn
      ConcurrentBuildLimit: 1
      TimeoutInMinutes: 30
      Source: {Type: GITHUB, Location: https://github.com/VamsiKrishnaSamavedam/aws-commerce-data-platform.git, BuildSpec: buildspec-dbt.yml, GitCloneDepth: 1}
      SourceVersion: master
      Artifacts: {Type: NO_ARTIFACTS}
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: AWS_REGION
            Value: !Ref AWS::Region
          - Name: DBT_S3_STAGING_DIR
            Value: !Sub 's3://${DataBucket}/athena-results/dbt/'
          - Name: DBT_S3_DATA_DIR
            Value: !Sub 's3://${DataBucket}/gold_dbt/'
      LogsConfig: {CloudWatchLogs: {Status: ENABLED, GroupName: /aws/codebuild/commerce-dbt-athena-build}}
  DbtBuildDispatcherRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: commerce-dbt-build-dispatcher
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      Policies:
        - PolicyName: dispatch-verified-dbt-builds
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents], Resource: '*'}
              - {Effect: Allow, Action: [codebuild:StartBuild, codebuild:ListBuildsForProject, codebuild:BatchGetBuilds], Resource: !GetAtt DbtBuildProject.Arn}
  DbtBuildDispatcherFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: commerce-dbt-build-dispatcher
      Runtime: python3.12
      Handler: scripts.dispatch_dbt_build.lambda_handler
      Role: !GetAtt DbtBuildDispatcherRole.Arn
      Timeout: 60
      MemorySize: 128
      ReservedConcurrentExecutions: 1
      Environment: {Variables: {CODEBUILD_PROJECT: !Ref DbtBuildProject}}
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Ref ArtifactKey}
  DbtBuildDispatchRule:
    Type: AWS::Events::Rule
    Properties:
      Name: commerce-dbt-after-verified-workflow
      EventPattern: {source: [aws.states], detail-type: [Step Functions Execution Status Change], detail: {stateMachineArn: [!Ref CustomerOrchestrator], status: [SUCCEEDED]}}
      State: ENABLED
      Targets: [{Arn: !GetAtt DbtBuildDispatcherFunction.Arn, Id: dbt-build-dispatcher, RetryPolicy: {MaximumEventAgeInSeconds: 3600, MaximumRetryAttempts: 12}}]
  DbtBuildDispatchPermission:
    Type: AWS::Lambda::Permission
    Properties: {Action: lambda:InvokeFunction, FunctionName: !Ref DbtBuildDispatcherFunction, Principal: events.amazonaws.com, SourceArn: !GetAtt DbtBuildDispatchRule.Arn}
  DbtBuildFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties: {AlarmName: commerce-dbt-athena-build-failures, Namespace: AWS/CodeBuild, MetricName: FailedBuilds, Dimensions: [{Name: ProjectName, Value: !Ref DbtBuildProject}], Statistic: Sum, Period: 300, EvaluationPeriods: 1, Threshold: 1, ComparisonOperator: GreaterThanOrEqualToThreshold, TreatMissingData: notBreaching, AlarmActions: [!Ref AlertTopicArn]}
  DailyOrderRevenueQuery:
    Type: AWS::Athena::NamedQuery
    Properties:
      Name: commerce-daily-order-revenue
      Database: commerce_analytics
      Description: Daily order and completed-payment performance.
      QueryString: "SELECT cast(ordered_at AS date) AS order_date, count(*) AS order_count, sum(order_total_amount) AS gross_order_amount, sum(completed_payment_amount) AS completed_payment_amount, sum(return_count) AS return_count FROM fct_orders WHERE ordered_at IS NOT NULL GROUP BY 1 ORDER BY 1 DESC"
  CategorySalesQuery:
    Type: AWS::Athena::NamedQuery
    Properties:
      Name: commerce-category-sales
      Database: commerce_analytics
      Description: Product category sales and unit performance.
      QueryString: "SELECT products.category, count(*) AS order_item_count, sum(items.quantity) AS units_sold, sum(items.line_item_amount) AS gross_merchandise_value FROM fct_order_items AS items INNER JOIN dim_products AS products ON items.product_id = products.product_id GROUP BY 1 ORDER BY gross_merchandise_value DESC"
  PaymentPerformanceQuery:
    Type: AWS::Athena::NamedQuery
    Properties:
      Name: commerce-payment-performance
      Database: commerce_analytics
      Description: Payment attempt and amount performance by method and status.
      QueryString: "SELECT payment_status, payment_method, count(*) AS payment_attempt_count, sum(payment_amount) AS payment_amount FROM fct_payments GROUP BY 1, 2 ORDER BY payment_status, payment_amount DESC"
  FulfillmentPerformanceQuery:
    Type: AWS::Athena::NamedQuery
    Properties:
      Name: commerce-fulfillment-performance
      Database: commerce_analytics
      Description: Shipment volume and delivery duration by carrier and status.
      QueryString: "SELECT shipment_status, carrier, count(*) AS shipment_count, avg(date_diff('day', shipped_at, delivered_at)) AS average_delivery_days FROM fct_shipments WHERE shipped_at IS NOT NULL AND delivered_at IS NOT NULL GROUP BY 1, 2 ORDER BY shipment_count DESC"
Outputs:
  StateMachineArn: {Value: !Ref CustomerOrchestrator}
  RegistrarFunctionArn: {Value: !GetAtt OrchestratorFunction.Arn}
  EventDeadLetterQueueUrl: {Value: !Ref EventFailureQueue}
  DbtBuildProjectName: {Value: !Ref DbtBuildProject}
